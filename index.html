<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFLG Parts Service</title>
<style>
  :root{
    --bg:#eef1f6; --panel:#ffffff; --line:#e3e8ef; --text:#172033; --muted:#64708a;
    --head:#1e293b; --head-text:#dbe3ee;
    --nav:#0f172a; --nav-text:#cbd5e1; --nav-muted:#7c8aa3; --nav-hover:rgba(255,255,255,.06); --nav-active:rgba(96,140,255,.18); --nav-line:rgba(255,255,255,.08);
    --accent:#2563eb; --accent-soft:#e9f0fd; --ok:#16803c; --warn:#b26b00; --bad:#c62f3d;
    --chip:#eef1f5; --shadow:0 1px 2px rgba(15,23,42,.05), 0 4px 14px rgba(15,23,42,.06);
    --radius:10px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1319; --panel:#171c24; --line:#2a313c; --head:#232c3a; --head-text:#cfd6e2; --nav:#0b0f15; --nav-text:#c3cad6; --nav-muted:#7a8496; --nav-hover:rgba(255,255,255,.05); --nav-active:rgba(110,160,239,.16); --nav-line:rgba(255,255,255,.07); --text:#e8ebf0; --muted:#9aa3b2;
      --accent:#4f8df5; --accent-soft:#1d2a40; --chip:#222a35; --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1319; --panel:#171c24; --line:#2a313c; --head:#232c3a; --head-text:#cfd6e2; --nav:#0b0f15; --nav-text:#c3cad6; --nav-muted:#7a8496; --nav-hover:rgba(255,255,255,.05); --nav-active:rgba(110,160,239,.16); --nav-line:rgba(255,255,255,.07); --text:#e8ebf0; --muted:#9aa3b2;
    --accent:#4f8df5; --accent-soft:#1d2a40; --chip:#222a35; --shadow:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
  @media (min-width:1800px){ body{font-size:16px} }
  a{color:var(--accent)}
  button,input,select,textarea{font:inherit;color:inherit}
  .app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  nav{background:var(--nav);color:var(--nav-text);border-right:0;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
  .brand{color:#fff;font-weight:700;font-size:19px;padding:4px 12px 22px;line-height:1.25;letter-spacing:-.01em}
  .brand small{display:block;font-weight:400;color:var(--nav-muted);font-size:13px;margin-top:3px}
  nav button{background:none;border:0;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:15px}
  nav button{color:var(--nav-text)}
  nav button:hover{background:var(--nav-hover);color:#fff}
  nav button.active{background:var(--nav-active);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #6b9bff}
  nav .count{font-size:11px;background:rgba(255,255,255,.1);color:var(--nav-text);padding:1px 7px;border-radius:999px}
  nav .spacer{flex:1}
  .status{font-size:12.5px;color:var(--nav-muted);padding:12px 12px 4px;border-top:1px solid var(--nav-line);line-height:1.5}
  .status b{color:var(--nav-text)}
  nav #lang{background:transparent;color:var(--nav-text);border:1px solid var(--nav-line);box-shadow:none}
  nav #lang:hover{border-color:#6b9bff;color:#fff}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  main{padding:28px 28px 80px;width:100%;max-width:2200px;min-width:0}
  .topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
  .topbar h1{font-size:26px;margin:0;flex:1;letter-spacing:-.01em}
  .btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:9px;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap;font-weight:500}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.danger{color:var(--bad)}
  .btn.sm{padding:5px 10px;font-size:13px;font-weight:400}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.primary:disabled{opacity:1;background:var(--panel);color:var(--ok);border-color:var(--line)}
  .btn.primary:not(:disabled):hover{filter:brightness(1.08)}
  input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
    border:1px solid var(--line);background:var(--panel);padding:9px 12px;border-radius:9px;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  textarea{min-height:70px;resize:vertical}
  input[type=file]{font-size:14px;max-width:100%}
  input[type=file]::file-selector-button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 14px;margin-right:10px;font:inherit;font-weight:500;cursor:pointer}
  input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;text-align:left;min-height:42px}
  input[type=date]::-webkit-date-and-time-value{text-align:left}
  .search{max-width:360px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .card .k{font-size:12px;color:var(--muted)} .card .v{font-size:26px;font-weight:700;margin-top:2px} .card .v.bad{color:var(--bad)} .card .v.warn{color:var(--warn)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
  .panel h2{font-size:15px;margin:0;padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-weight:600;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;background:var(--bg);position:sticky;top:0;cursor:pointer;user-select:none}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:var(--accent-soft)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .mono{font-family:var(--mono);font-size:13px}
  .iline{height:24px;line-height:24px;white-space:nowrap}
  td .iline+.iline{margin-top:4px}
  td.nw,td.nw small{white-space:nowrap}
  .panel:has(> table.rq){overflow-x:auto}
  table.rq{width:100%;min-width:1100px}
  table.rq th,table.rq td{padding:12px 12px}
  table.rq .c{white-space:nowrap}
  table.rq .gl{border-left:0}
  table.rq .gr{border-right:0}
  table.rq th{background:var(--panel);color:var(--muted);font-size:11.5px;letter-spacing:.06em;padding-top:12px;padding-bottom:12px;border-bottom:1px solid var(--line);vertical-align:bottom}
  table.rq tr.grph th{font-size:11px;letter-spacing:.08em;color:var(--text);padding:9px 12px 0;border-bottom:0;vertical-align:bottom}
  table.rq tr.grph th::after{content:'';display:block;height:3px;border-radius:2px;margin-top:7px;background:var(--accent)}
  table.rq tr.grph th:last-child::after{background:#3fa66b}
  /* three colour bars are the only group dividers: no vertical rules */
  table.rq tr.grph th{padding-left:10px;padding-right:10px}
  table.rq tr.grph th:not(:last-child)::after{margin-right:6px}
  table.rq tr.grph th.rqnoh{vertical-align:top;cursor:pointer}
  table.rq tr.grph th.rqnoh::after{background:var(--text)}
  /* request number: leads the whole row */
  table.rq td.rqno a{font-size:17px;font-weight:800;color:var(--text);text-decoration:none;letter-spacing:.01em;white-space:nowrap}
  table.rq tr.rowlink:has(td:not(.pz):hover) td.rqno a{color:var(--accent)}
  table.rq td.rqno .sub{margin-top:4px}
  table.rq .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
  table.rq .nm .iline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  table.rq td.nm{max-width:0}
  table.rq .rqr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0}
  table.rq .pc{white-space:nowrap}
  table.rq td.fl a{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;line-height:1.6;text-decoration:none;padding:1px 6px;margin:0 -6px;border-radius:5px}
  /* clear hover on links inside a (hovered) row */
  table.rq td.fl a:hover,table.rq .trk a:hover{background:color-mix(in srgb,var(--accent) 16%,var(--panel));color:var(--accent);text-decoration:underline}
  table.rq .trk a{padding:1px 4px;margin:0 -4px;border-radius:5px;display:inline-block;white-space:nowrap}
  table.rq td.fl{max-width:0}
  .rqc-proc a{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  table.rq .trk{white-space:normal}
  table.rq .trk a{color:var(--accent);text-decoration:none}
  table.rq .trk a:hover{text-decoration:underline}
  #trk-go{margin-left:8px;font-weight:500}   /* carrier and number may sit on two lines; the number itself never breaks */
  table.rq tr.rowlink{cursor:pointer}
  /* one continuous header band; small dividers inside it mark the three parts (No. | Request & parts | Procurement) */
  table.rq tr:first-child th{background:var(--head);color:var(--head-text);border-bottom:0}
  table.rq tr:first-child th:first-child,table.rq td:first-child{padding-left:16px}
  table.rq tr:first-child th:last-child,table.rq td:last-child{padding-right:16px}
  table.rq th.sp,table.rq td.sp{padding:0!important;position:relative}
  table.rq th.sp::after{content:'';position:absolute;left:50%;top:50%;width:1px;height:18px;transform:translateY(-50%);background:color-mix(in srgb,var(--head-text) 35%,transparent)}
  table.rq{border-collapse:separate;border-spacing:0}
  .panel.rq-panel{padding:0;overflow-x:auto}
  table.rq td{border-bottom:1px solid var(--line)}
  table.rq tr:last-child td{border-bottom:0}

  @media (max-width:1600px){ table.rq th,table.rq td{padding-left:8px;padding-right:8px} table.rq td.g.gl .sub{max-width:90px} table.rq .rqr{min-width:70px} }
  table.rq .fill{width:auto;padding:0}
  table.rq td.g.gl .sub{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (min-width:1700px){ table.rq td.g.gl .sub{max-width:200px} table.rq th,table.rq td{padding-left:8px;padding-right:8px} }
  table.rq td.num.g{padding-right:16px}
  table.rq .qty{font-weight:700;font-size:15.5px;color:var(--text)}
  table.rq td.g .iline{height:30px;line-height:30px}
  table.rq td.g .iline+.iline{margin-top:0;border-top:1px dashed var(--line)}
  table.rq td.g{padding-top:6px;padding-bottom:6px}
  table.rq td.g:not(.gl){padding-left:0;padding-right:0}
  table.rq td.g:not(.gl) .iline{padding:0 8px}
  table.rq td.g.gr .iline{padding-right:14px}
  table.rq td.g.gl{padding-top:11px}
  table.rq td{vertical-align:top}
  table.rq td:not(.g){padding-top:12px}
  /* left side opens the request on section 1, the Procurement side opens it on section 2; links inside keep their own action */
  /* hover lights only the half you will open: left = request & parts, right = procurement */
  table.rq tr.rowlink:hover td{background:var(--panel)}
  table.rq tr.rowlink:has(td:not(.pz):hover) td:not(.pz),
  table.rq tr.rowlink:has(td.pz:hover) td.pz{background:color-mix(in srgb,var(--accent-soft) 60%,var(--panel))}
  .chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:500;background:var(--chip);white-space:nowrap}
  .chip.s-requested{background:#eceff3;color:#4b5563}
  .chip.s-processing,.chip.s-quoting{background:#fff4d6;color:#8a5a00}
  .chip.s-ordered{background:#e3ecff;color:#1f4fbf}
  .chip.s-shipped{background:#e6f4ff;color:#0b6aa2}
  .chip.s-received{background:#e1f5e8;color:#1e7a46}
  .chip.s-closed{background:#efefef;color:#777}
  .chip.u-urgent{background:#fde4e6;color:#b4232f} .chip.u-high{background:#fff0d9;color:#9a5b00}
  .chip.low{background:#fde4e6;color:#b4232f}
  .empty{padding:64px 28px;text-align:center;color:var(--muted);font-size:15px}
  .empty .ico{font-size:40px;line-height:1;margin-bottom:12px;opacity:.5}
  .row-actions{white-space:nowrap}
  .row-actions button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0 5px;font-size:14px}
  .row-actions button.del{color:var(--bad)}
  /* pipeline */
  .pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px}
  .pipe .col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px;min-height:120px}
  .pipe .col h3{font-size:13px;margin:0 0 10px;color:var(--muted);display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.04em}
  .pipe .col.over{outline:2px dashed var(--accent)}
  .rcard{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;background:var(--bg);cursor:grab;font-size:13px}
  .rcard b{display:block;font-size:14px;margin-bottom:2px}
  .rcard .meta{color:var(--muted)}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border-radius:14px;width:100%;max-width:900px;padding:26px 30px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h2{margin:0 0 18px;font-size:21px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
  .grid .full{grid-column:1/-1}
  .rqhead{display:grid;grid-template-columns:1fr .85fr 1.75fr .8fr 1.1fr;gap:12px}
  .rqhead>*{min-width:0}
  .rqfoot{display:grid;grid-template-columns:1fr 240px;gap:12px;align-items:start}
  .rqfoot>*{min-width:0}
  .prochead{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .prochead>*{min-width:0}
  .prochead .span2{grid-column:span 2}
  .fslots{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .fslot{display:flex;align-items:center;gap:10px;padding:7px 12px;min-width:0;min-height:40px}
  .fslot+.fslot{border-top:1px solid var(--line)}
  .fslot-h{flex:0 0 130px;font-size:13px;font-weight:600;color:var(--muted)}
  .fslot-files{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px 8px}
  .fslot .frow{display:inline-flex;align-items:center;gap:2px;max-width:100%;padding:2px 4px 2px 8px;background:var(--accent-soft);border:0;border-radius:6px;margin:0}
  .fslot .frow a{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;max-width:220px}
  .fslot .fx{border:0;background:none;color:var(--bad);cursor:pointer;font-size:11px;padding:2px 4px}
  .fup{flex:0 0 auto;font-size:13px;color:var(--accent);cursor:pointer;font-weight:500;white-space:nowrap}
  .fup:hover{text-decoration:underline}
  .money{position:relative}
  .money span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  .money input{padding-left:24px!important;text-align:left}
  .rqfoot textarea{min-height:44px;height:44px}
  .photobtn{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;cursor:pointer;width:100%}
  .photolist{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .docwrap{max-width:1100px}
  .setwrap{max-width:860px}
  .setwrap .panel{margin-bottom:16px}
  .dochead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 14px}
  .dochead .dt{font-size:18px;font-weight:700}.dochead .dt span{font-weight:400;color:var(--muted);font-size:15px;margin-left:6px}
  .dochead .ds{font-size:13px;color:var(--muted);margin-top:2px}
  .doctab td{padding:9px 14px;vertical-align:middle}
  .doctab td:first-child a{color:var(--text);text-decoration:none;font-weight:500}
  .doctab td:first-child a:hover{color:var(--accent);text-decoration:underline}
  .doctab tr.grp td{background:var(--bg);font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:7px 14px}
  .doctab tr:hover td{background:var(--accent-soft)} .doctab tr.grp:hover td{background:var(--bg)}
  .doctab .dm{color:var(--muted);font-size:13px;white-space:nowrap}
  .doctab .dn{font-size:12px;color:var(--muted);margin-top:2px}
  .doctab td.row-actions{text-align:right;width:1%}
  .sec{border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px;margin-bottom:16px}
  .sec.proc{background:var(--accent-soft);border-color:transparent;border-left:4px solid var(--accent)}
  .sec-h{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:15px;font-weight:700}
  .sec-h .n{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;align-items:center;justify-content:center}
  .sec-h small{font-weight:400;color:var(--muted);font-size:13px}
  .sec.proc input,.sec.proc select,.sec.proc textarea{background:var(--panel)}
  .sec-act{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:2px}
  .sec-act .hint{font-size:12px;color:var(--muted)}
  label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .note.warn{background:#fdecee;color:#9b1c2c}
  .note{background:var(--accent-soft);border-radius:9px;padding:10px 14px;font-size:13.5px;margin-bottom:16px;line-height:1.5}
  .items table td{padding:4px 6px}
  .items input{padding:6px 10px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
  .items table{table-layout:fixed}
  .items .addline{margin:6px 0 0 6px}
  /* items: one soft panel, no row lines — rows are separated by spacing only */
  .items{background:var(--bg);border-radius:10px;padding:6px 8px 10px}
  .items td{border:0}
  .items th{background:transparent!important;border:0;padding:6px 6px 2px;font-size:11.5px}
  .items tr:hover td{background:var(--accent-soft)!important}
  .items tr:hover td:first-child{border-radius:8px 0 0 8px}
  .items tr:hover td:last-child{border-radius:0 8px 8px 0}
  .items input{background:var(--panel)}
  .items .imeta{min-height:15px}
  .pncell{position:relative}
  .pn-dd{display:none;position:absolute;left:6px;top:calc(100% - 2px);z-index:20;min-width:460px;max-height:320px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
  .pn-opt{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:7px 10px;cursor:pointer;font-size:13px}
  .pn-opt:hover,.pn-opt.on{background:var(--accent-soft)}
  .pn-opt b{color:var(--accent)}
  .pn-nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pn-fig{font-size:11.5px;color:var(--muted)}
  .imeta{font-size:11.5px;color:var(--muted);margin-top:3px}
  .files .frow{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
  .files .frow a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pthumb{position:relative}
  .items th{position:static!important}
  .pthumb a{display:block;max-width:160px;overflow:hidden;border-radius:6px}
  .pthumb img{height:72px;min-width:48px;max-width:160px;object-fit:cover;color:var(--muted);font-size:11px;border-radius:6px;border:1px solid var(--line);display:block;background:var(--bg)}
  .pthumb button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--bad);font-size:11px;cursor:pointer;line-height:1;padding:0}
  .fmeta{font-size:12px;color:var(--muted);white-space:nowrap}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}

  // two people created a request at the same time → give the newer local one the next free number
  const used=new Set((r.requests||[]).map(x=>x.no)), remoteIds=new Set((r.requests||[]).map(x=>x.id));
  const num=no=>parseInt(String(no||'').replace(/\D/g,''))||0;
  let next=Math.max(0,...out.requests.map(x=>num(x.no)))+1;
  for(const x of out.requests){ if(!remoteIds.has(x.id) && used.has(x.no)){ x.no='NFLG-'+String(next++).padStart(4,'0'); } }
  out.meta.nextReqNo=Math.max(next, Math.max(0,...out.requests.map(x=>num(x.no)))+1);
  return out; }

const apiUrl = () => `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${DATA_PATH}`;
const ghHeaders = () => ({Authorization:'Bearer '+gh.token, Accept:'application/vnd.github+json'});
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function fetchRemote(){
  const r = await fetch(apiUrl()+'?ref='+encodeURIComponent(gh.branch||'main')+'&t='+Date.now(), {headers:ghHeaders(), cache:'no-store'});
  if (r.status===404) return {sha:null, data:emptyDb()};
  if (!r.ok) throw new Error('GitHub '+r.status);
  const j=await r.json(); const data=JSON.parse(b64dec(j.content)); data.meta=Object.assign(emptyDb().meta,data.meta||{}); return {sha:j.sha, data:Object.assign(emptyDb(),data)}; }

async function load(){
  let draft=null, savedBase=null;
  try{ draft=JSON.parse(localStorage.getItem('nflg.draft')||'null'); savedBase=JSON.parse(localStorage.getItem('nflg.base')||'null'); }catch(e){}
  let remote;
  try {
    if (gh.token && gh.owner && gh.repo){ const x=await fetchRemote(); remote=x.data; remoteSha=x.sha; }
    else { const r = await fetch(DATA_PATH+'?t='+Date.now(), {cache:'no-store'}); remote = r.ok ? await r.json() : emptyDb(); remote=Object.assign(emptyDb(),remote); remote.meta=Object.assign(emptyDb().meta,remote.meta||{}); }
  } catch(e){ console.warn(e); toast('加载失败：'+e.message+'（使用本地数据）'); remote = draft || emptyDb(); }
  base=clone(remote);
  // unsaved edits from last time are merged in, never silently dropped and never overwrite newer data
  db = draft ? merge3(savedBase||remote, draft, remote) : clone(remote);
  dirty = !same(db, remote);
  if(!dirty){ try{ localStorage.removeItem('nflg.draft'); localStorage.removeItem('nflg.base'); }catch(e){} }
  updateStatus(); render();
  if(dirty && gh.token) save();
}

async function save(){
  if (!gh.token){ toast('请先在「设置」里填写 GitHub token'); return; }
  if (saving){ savePending=true; return; }
  clearTimeout(saveTimer); saving=true; updateStatus();
  const localAtStart=clone(db);
  try {
    for(let attempt=0; attempt<4; attempt++){
      const {sha, data:remote} = await fetchRemote();
      const merged = sha===remoteSha && base ? clone(localAtStart) : merge3(base, localAtStart, remote);
      merged.meta.updated = new Date().toISOString(); merged.meta.updatedBy = me();
      const body = {message:`update db.json (${me()||'web'}) ${merged.meta.updated.slice(0,16)}`, content:b64enc(JSON.stringify(merged,null,2)), branch:gh.branch||'main'};
      if (sha) body.sha=sha;
      const p = await fetch(apiUrl(), {method:'PUT', headers:{...ghHeaders(),'Content-Type':'application/json'}, body:JSON.stringify(body)});
      if (p.status===409 || p.status===422){ continue; }            // someone saved in between → fetch again and re-merge
      if (!p.ok){ const t=await p.text(); throw new Error(p.status+' '+t.slice(0,200)); }
      const j = await p.json(); remoteSha=j.content.sha; base=clone(merged);
      // keep anything typed while we were saving
      db = same(db, localAtStart) ? merged : merge3(localAtStart, db, merged);
      dirty = !same(db, base);
      if(!dirty){ try{ localStorage.removeItem('nflg.draft'); localStorage.removeItem('nflg.base'); }catch(e){} }
      if(!$('#overlay').classList.contains('open')) render(); else { $('#view').innerHTML=L(({requests:renderRequests,docs:renderDocs,settings:renderSettings}[view]||renderRequests)()); }
      break;
    }
  } catch(e){ toast('保存失败：'+e.message); console.warn(e); }
  saving=false; updateStatus();
  if (savePending || dirty){ savePending=false; if(dirty){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>save(),1500); } }
}

// pick up other people's changes every 45 s (never touches an open request dialog)
async function pull(){
  if(!gh.token || saving || document.hidden) return;
  try{ const {sha, data:remote}=await fetchRemote(); if(sha===remoteSha) return;
    db = dirty ? merge3(base, db, remote) : clone(remote); base=clone(remote); remoteSha=sha; dirty=!same(db,base);
    if(!$('#overlay').classList.contains('open')) render(); else { $('#view').innerHTML=L(({requests:renderRequests,docs:renderDocs,settings:renderSettings}[view]||renderRequests)()); }
    updateStatus(); if(dirty) save(); }catch(e){ console.warn(e); } }
setInterval(pull, 45000);

function bindPipeline(){

function setStatus_(id, status){
  const r=db.requests.find(x=>x.id===id); if(!r||r.status===status) return;
  snapshot(); const prev=r.status; r.status=status;
  (r.history=r.history||[]).push({ts:new Date().toISOString(), user:me(), from:prev, to:status});
  if (status==='received' && !r.receivedApplied){ // put stock in
    for (const i of r.items||[]){ const p=partById(i.partId); if(p) p.stock=stockOf(p)+Number(i.qty||0); }
    r.receivedApplied=true; r.receivedDate=today();
  }
  markDirty(); render();
}

function importPartsCsv(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.csv,text/csv';

    if(ix.partNo<0) return alert('CSV 需要至少有 PartNo 列（列名同导出格式）');
    snapshot(); let added=0,updated=0;
    for(const r of rows.slice(1)){ const no=(r[ix.partNo]||'').trim(); if(!no) continue; let p=db.parts.find(x=>x.partNo===no); if(!p){p={id:uid(),partNo:no}; db.parts.push(p); added++;} else updated++;
      for(const k in ix){ if(ix[k]<0||k==='partNo') continue; let v=r[ix[k]]; if(v==null||v==='') continue; if(k==='models') v=v.split(/[;,]/).map(s=>s.trim()).filter(Boolean); else if(['stock','minStock','lastPrice','leadTimeDays'].includes(k)) v=Number(v); p[k]=v; } }
    markDirty(); render(); toast(`导入完成：新增 ${added}，更新 ${updated}`); };
  inp.click();

function parseCsv(t){ const rows=[]; let row=[],cur='',q=false; t=t.replace(/^\ufeff/,'');
  for(let i=0;i<t.length;i++){ const c=t[i]; if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(cur);cur='';} else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=c; }
  if(cur!==''||row.length){row.push(cur);rows.push(row);} return rows.filter(r=>r.some(x=>x!=='')); }

function saveModel(code){
  const v=k=>$('#m-'+k).value.trim(); const nc=v('code'); if(!nc) return alert('型号必填');
  if(models().some(x=>x.code===nc&&x.code!==code)) return alert('该型号已存在');
  snapshot(); let m; if(code){ m=models().find(x=>x.code===code); if(nc!==code){ (db.docs||[]).forEach(d=>{if(d.model===code)d.model=nc;}); db.equipment.forEach(e=>{if(e.model===code)e.model=nc;}); } } else { m={}; models().push(m); }
  Object.assign(m,{code:nc,engine:v('engine'),nameZh:v('zh'),nameEn:v('en'),notes:v('notes')});
  sessionStorage.setItem('f.model',nc); markDirty(); closeModal(); render();
}
function delModel(code){
  const n=(db.docs||[]).filter(d=>d.model===code).length, u=db.requests.filter(r=>r.model===code).length;
  if(n||u) return alert(`该机型还有 ${n} 个文档、${u} 台设备，先移走再删除`);
  if(!confirm('删除机型 '+esc(code)+'？')) return; snapshot(); db.meta.models=models().filter(x=>x.code!==code); markDirty(); closeModal(); render();
}

function docSrc(){ const s=document.querySelector('input[name=d-src]:checked')?.value; $('#d-file').style.display=s==='upload'?'':'none'; $('#d-url').style.display=s==='url'?'':'none'; }
async function saveDoc(id){
  const v=k=>$('#d-'+k).value.trim(); if(!v('model')||!v('title')) return alert('机型和标题必填');
  const src=document.querySelector('input[name=d-src]:checked').value;
  if(src==='url'&&v('url')&&!/^https?:\/\//i.test(v('url'))) return alert('链接需以 http(s):// 开头');
  const existing = id? db.docs.find(x=>x.id===id) : null;
  let uploaded=null;
  if(src==='upload'&&docFile){
    if(!gh.token) return alert('上传文件需要先在「设置」里配置 GitHub token；或者改用外部链接。');
    if(docFile.size>MAX_UPLOAD_MB*1048576) return alert(`文件 ${fmtSize(docFile.size)} 超过 ${MAX_UPLOAD_MB} MB，请放 OneDrive 后填链接。`);
    const btn=$('#d-save'); btn.disabled=true; btn.textContent=L('上传中… ')+fmtSize(docFile.size);
    try { uploaded = await uploadToRepo(`docs/${v('model')}/${docFile.name.replace(/[\\/:*?"<>|]/g,'_')}`, docFile); }
    catch(e){ btn.disabled=false; btn.textContent='保存'; return alert('上传失败：'+e.message); }
    if(existing?.path && existing.path!==uploaded.path) deleteFromRepo(existing.path, existing.sha).catch(()=>{});
  } else if(src==='upload'&&!existing?.path&&!id){ return alert('请选择要上传的文件，或改选其他来源'); }
  snapshot(); let d; if(id) d=existing; else { d={id:uid()}; (db.docs=db.docs||[]).push(d); }
  Object.assign(d,{model:v('model'),category:v('cat'),title:v('title'),version:v('version'),date:v('date'),notes:v('notes')});
  if(uploaded){ Object.assign(d,{path:uploaded.path,sha:uploaded.sha,size:docFile.size,fileName:docFile.name,url:'',uploadedBy:me(),uploadedAt:new Date().toISOString()}); }
  else if(src==='url'){ if(d.path) deleteFromRepo(d.path,d.sha).catch(()=>{}); Object.assign(d,{url:v('url'),path:'',sha:'',size:'',fileName:''}); }
  else if(src==='none'){ if(d.path) deleteFromRepo(d.path,d.sha).catch(()=>{}); Object.assign(d,{url:'',path:'',sha:'',size:'',fileName:''}); }
  sessionStorage.setItem('f.model',d.model); markDirty(); closeModal(); render();
  if(uploaded) { toast('文件已上传，正在保存记录…'); await save(false); }
}
async function delDoc(id){
  const d=db.docs.find(x=>x.id===id); if(!d) return;
  if(!confirm(`删除「${esc(d.title)}」？${d.path?'\n仓库里的文件也会一起删除。':''}`)) return;
  if(d.path){ try{ await deleteFromRepo(d.path,d.sha); }catch(e){ if(!confirm('删除仓库文件失败：'+e.message+'\n仍然删除记录？')) return; } }
  snapshot(); db.docs=db.docs.filter(x=>x.id!==id); markDirty(); render(); if(d.path) await save(false);
}
function fileToB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); }); }
async function uploadToRepo(path, file){
  const url=`https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
  const body={message:`upload ${path} (${me()||'web'})`, content:await fileToB64(file), branch:gh.branch||'main'};
  const g=await fetch(url+'?ref='+encodeURIComponent(gh.branch||'main'),{headers:ghHeaders(),cache:'no-store'}); if(g.ok){ body.sha=(await g.json()).sha; }
  const r=await fetch(url,{method:'PUT',headers:{...ghHeaders(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,200));
  const j=await r.json(); return {path, sha:j.content.sha};
}
async function deleteFromRepo(path, sha){
  const url=`https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
  if(!sha){ const g=await fetch(url+'?ref='+encodeURIComponent(gh.branch||'main'),{headers:ghHeaders(),cache:'no-store'}); if(!g.ok) return; sha=(await g.json()).sha; }
  const r=await fetch(url,{method:'DELETE',headers:{...ghHeaders(),'Content-Type':'application/json'},body:JSON.stringify({message:`delete ${path} (${me()||'web'})`,sha,branch:gh.branch||'main'})});
  if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,200));
}

// Leaving a request dialog (✕ / Close / Esc) saves whatever was changed; clicking outside the dialog no longer closes it
let reqForm=null;   // {id, sig:{req,proc}} captured when a request dialog opens
function secSig(k){ const sec=$(`#modal .sec[data-k="${k}"]`); if(!sec) return '';
  return JSON.stringify([...sec.querySelectorAll('input:not([type=file]):not(#r-search),select,textarea')].map(e=>e.type==='checkbox'?e.checked:e.value))+(k==='req'?JSON.stringify(draftItems)+draftPhotos.length:''); }
async function leaveRequest(){
  const f=reqForm; if(!f||!$('#overlay').classList.contains('open')) return closeModal();
  const chg=['req','proc'].filter(k=>secSig(k)!==f.sig[k]);
  if(!chg.length) return closeModal();
  if(!f.id){ if(confirm(L('这条新申请还没提交，确定放弃？'))) closeModal(); return; }
  const ok = chg.length>1 ? await saveRequest(f.id) : await saveRequest(f.id,chg[0]);
  if(!ok) return;   // validation failed → stay open so nothing is lost
  closeModal(); toast(L('已保存'));
}
// US-dollar amount: "$" shown in front, value stored as plain number text like 1,250.00
const moneyClean = v => String(v??'').replace(/^\s*(USD|US\$|\$)\s*/i,'').trim();
const moneyFmt = v => { const t=moneyClean(v); const n=Number(t.replace(/,/g,'')); return t&&isFinite(n) ? n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : t; };
const moneyInp = (id,val,ph) => `<div class="money"><span>$</span><input type="text" inputmode="decimal" id="${id}" value="${esc(moneyFmt(val))}" placeholder="${ph}" onblur="this.value=moneyFmt(this.value)"></div>`;
// Tracking text -> carrier tracking page (UPS / FedEx / DHL / USPS recognised; anything else opens a web search)
function trackUrl(t){
  t=String(t||'').trim(); if(!t) return '';
  const toks=t.split(/[\s,;/]+/).filter(Boolean), num=(toks.filter(x=>/^[A-Za-z0-9-]{8,}$/.test(x)&&/\d/.test(x)).sort((a,b)=>b.length-a.length)[0]||'').replace(/-/g,'');
  if(!num) return ''; const lc=t.toLowerCase(), q=encodeURIComponent(num);
  if(/ups/.test(lc)||/^1Z[0-9A-Z]{16}$/i.test(num)) return 'https://www.ups.com/track?loc=en_US&tracknum='+q;
  if(/fedex|fed ex/.test(lc)) return 'https://www.fedex.com/fedextrack/?trknbr='+q;
  if(/dhl/.test(lc)) return 'https://www.dhl.com/us-en/home/tracking/tracking-express.html?submit=1&tracking-id='+q;
  if(/usps/.test(lc)||/^9[0-9]{19,21}$/.test(num)) return 'https://tools.usps.com/go/TrackConfirmAction?tLabels='+q;
  if(/^[0-9]{12}$|^[0-9]{15}$/.test(num)) return 'https://www.fedex.com/fedextrack/?trknbr='+q;
  return 'https://www.google.com/search?q='+encodeURIComponent(t+' tracking');
}
const trackLink=(t,cls='')=>{ const u=trackUrl(t); return u?`<a class="${cls}" href="${esc(u)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Track shipment">${esc(t)}&nbsp;↗</a>`:esc(t||''); };

let draftItems=[], draftPhotos=[];
async function uploadProcFiles(id, files, cat){
  if(!files.length) return; const r=db.requests.find(x=>x.id===id); if(!r) return;
  if(!gh.token) return alert('上传附件需要先连上 GitHub（团队链接或 Settings 里的 token）。');
  const st=$('#up-status'); const added=[];
  for(const [k,f] of [...files].entries()){
    if(f.size>MAX_UPLOAD_MB*1048576){ alert(`文件 ${f.name} 超过 ${MAX_UPLOAD_MB} MB，请放 OneDrive 后填链接。`); continue; }
    if(st) st.textContent=L(`上传中… ${k+1}/${files.length}`);
    try{ const safe=f.name.replace(/[\\/:*?"<>|#%]/g,'_'); const up=await uploadToRepo(`attachments/${r.no}/${Date.now()}-${safe}`, f);
      added.push({path:up.path,sha:up.sha,name:f.name,size:f.size,ts:new Date().toISOString(),user:me(),cat:cat||''}); }
    catch(e){ alert('上传失败：'+e.message); }
  }
  if(!added.length){ if(st) st.textContent=''; return; }
  snapshot(); r.files=[...(r.files||[]),...added];
  (r.history=r.history||[]).push({ts:new Date().toISOString(),user:me(),kind:'files',n:added.length});
  markDirty(); render(); await save(false); editRequest(id); toast(L('附件已上传'));
}
async function removeProcFile(id,k){
  const r=db.requests.find(x=>x.id===id); const f=r?.files?.[k]; if(!f) return;

  try{ await deleteFromRepo(f.path,f.sha); }catch(e){}
  snapshot(); r.files.splice(k,1); markDirty(); render(); if(gh.token) await save(false); editRequest(id);
}

  const r=db.requests.find(x=>x.id===id); if(!r) return;
  const zh=LANG==='zh', t=(a,b)=>zh?a:b, m=models().find(x=>x.code===r.model);

  const half=v=>{ v=String(v||''); const k=v.indexOf(' '); return k<0?v:(zh?v.slice(0,k):v.slice(k+1)); };
  const proc=[kv(t('状态','Status'),half(lbl(STATUSES,r.status))),kv('PO#',r.poNo),kv(t('运输 / 单号','Shipping / tracking'),r.shipping),kv('ETA',r.eta)].join('');
  const html=`<div class="ph"><div><h1>${t('NFLG 配件申请','NFLG Parts Request')}</h1><div class="sub">NFLG Parts Service</div></div>
      <div><div class="no">${esc(r.no||'')}</div><div class="sub">${t('申请日期','Request date')}: ${esc(r.date||'')}</div></div></div>
    <div class="kv">${kv(t('机型','Model'),r.model+(m?' · '+mname(m):''))}${kv(t('设备编号 / 序列号','Unit no. / serial'),r.unit)}
      ${kv(t('紧急度','Urgency'),half(lbl(URGENCY,r.urgency)))}${kv(t('需要日期','Need by'),r.needBy)}</div>
    <h3>${t('配件清单','Items')}</h3>
    <table><tr><th style="width:28px">#</th><th style="width:120px">${t('零件号','Part No.')}</th><th>${t('名称 / 描述','Name / description')}</th><th class="q">${t('数量','Qty')}</th><th style="width:150px">${t('手册位置','Manual ref.')}</th></tr>
      ${items.map((i,k)=>`<tr><td>${k+1}</td><td class="mono">${esc(i.partNo||'')}</td><td>${esc(i.name||'')}</td><td class="q">${esc(i.qty??'')}</td><td style="white-space:nowrap">${ref(i)}</td></tr>`).join('')}</table>
    ${(r.reason||r.notes)?`<h3>${t('原因 / 备注','Reason / notes')}</h3><div class="txt">${esc([r.reason,r.notes].filter(Boolean).join('\n'))}</div>`:''}
    ${proc?`<h3>${t('采购与物流','Procurement & shipping')}</h3><div class="kv">${proc}</div>`:''}
    ${(r.photos||[]).length?`<h3>${t('照片','Photos')}</h3><div class="photos">${r.photos.map(p=>`<img src="${esc(rawHref(p))}">`).join('')}</div>`:''}
    <div class="foot">${t('导出时间','Exported')} ${new Date().toLocaleString()}</div>`;
  let el=$('#print-area'); if(!el){ el=document.createElement('div'); el.id='print-area'; document.body.appendChild(el); }
  el.innerHTML=html.replace(/[]/g,'');
  const title=document.title, done=()=>{ document.body.classList.remove('printing'); document.title=title; window.removeEventListener('afterprint',done); };
  document.body.classList.add('printing'); document.title=(r.no||'NFLG-request')+(r.model?' '+r.model:'');
  window.addEventListener('afterprint',done);
  const imgs=[...el.querySelectorAll('img')].filter(i=>!i.complete);
  Promise.all(imgs.map(i=>new Promise(ok=>{ i.onload=i.onerror=ok; setTimeout(ok,4000); }))).then(()=>setTimeout(()=>window.print(),50));
}
function itemMeta(i){ const model=$('#r-model')?.value; if(!i.fig) return '<div class="imeta blank">&nbsp;</div>'; const lk=i.page?manualLink(model,i.page):'';
  return `<div class="imeta">手册图 ${esc(i.fig)}${i.item?' 项 '+esc(i.item):''}${i.page?(lk?` · <a href="${esc(lk)}" target="_blank" title="Open manual page">p.${esc(i.page)}</a>`:` · p.${esc(i.page)}`):''}</div>`; }
function renderItems(){
  $('#items').innerHTML = L(`<table><tr><th style="width:170px">零件号 Part No.</th><th>名称 / 描述</th><th style="width:84px">数量</th><th style="width:48px"></th></tr>
    ${draftItems.map((i,n)=>`<tr><td class="pncell"><input id="pn-${n}" value="${esc(i.partNo)}" autocomplete="off" oninput="pnInput(${n},this)" onkeydown="pnKey(event,${n})" onfocus="pnInput(${n},this)" onblur="setTimeout(()=>pnHide(${n}),150)" placeholder="输入零件号，自动带出名称"><div class="pn-dd" id="pndd-${n}"></div></td>
      <td><input id="nm-${n}" value="${esc(i.name)}" oninput="draftItems[${n}].name=this.value" placeholder="名称或描述（手填也可以）"><span id="meta-${n}">${itemMeta(i)}</span></td>
      <td><input id="qt-${n}" type="number" min="1" value="${esc(i.qty)}" oninput="draftItems[${n}].qty=Number(this.value)"></td><td><button class="btn sm" onclick="draftItems.splice(${n},1);renderItems()">✕</button></td></tr>`).join('')}
    </table><button class="btn sm addline" onclick="draftItems.push({partId:'',partNo:'',name:'',qty:1});renderItems()">＋ 添加一行</button>`);
}
// --- part-number autocomplete from the model's spare-parts manual index ---
const pnState={};
function pnName(p){ return LANG==='zh' ? (p.zh||p.en) : (p.en||p.zh); }
function pnUnique(parts){ const seen=new Set(), out=[]; for(const p of parts){ if(seen.has(p.pn)) continue; seen.add(p.pn); out.push(p); } return out; }
async function pnInput(n, el){
  const val=el.value.trim(); const i=draftItems[n]; i.partNo=val;
  const model=$('#r-model')?.value; const idx=model? await loadManualIndex(model) : null;
  const dd=$('#pndd-'+n); if(!dd) return;
  // exact match → fill name/figure right away
  const exact = idx && idx.parts.find(p=>p.pn===val) || null;
  const cat = !exact && db.parts.find(x=>x.partNo===val);
  if(exact){ i.name=pnName(exact); i.fig=exact.fig; i.item=exact.item; i.page=exact.page; i.partId=''; $('#nm-'+n).value=i.name; $('#meta-'+n).innerHTML=L(itemMeta(i)); }
  else if(cat){ i.partId=cat.id; i.name=pnameTxt(cat); $('#nm-'+n).value=i.name; }
  else { delete i.fig; delete i.item; delete i.page; i.partId=''; $('#meta-'+n).innerHTML=''; }
  if(!idx || val.length<2 || exact){ dd.style.display='none'; return; }
  const q=val.toLowerCase();
  let hits=idx.parts.filter(p=>p.pn.startsWith(val));
  if(hits.length<12) hits=hits.concat(idx.parts.filter(p=>!p.pn.startsWith(val)&&(p.pn.includes(val)||(p.en+' '+p.zh).toLowerCase().includes(q))));
  hits=pnUnique(hits).slice(0,12);
  pnState[n]={hits,sel:-1};
  if(!hits.length){ dd.style.display='none'; return; }
  dd.innerHTML=L(hits.map((p,k)=>`<div class="pn-opt" data-k="${k}" onmousedown="event.preventDefault();pnPick(${n},${k})"><span class="mono">${hl(p.pn,val)}</span><span class="pn-nm">${esc(pnName(p))}</span><span class="pn-fig">${esc(p.fig)}</span></div>`).join(''));
  dd.style.display='block';
}
function hl(s,q){ const i=s.indexOf(q); return i<0? esc(s) : esc(s.slice(0,i))+'<b>'+esc(s.slice(i,i+q.length))+'</b>'+esc(s.slice(i+q.length)); }
function pnHide(n){ const dd=$('#pndd-'+n); if(dd) dd.style.display='none'; }
function pnPick(n,k){ const p=pnState[n]?.hits[k]; if(!p) return; Object.assign(draftItems[n],{partNo:p.pn,name:pnName(p),fig:p.fig,item:p.item,page:p.page,partId:''});
  renderItems(); const q=$('#qt-'+n); q?.focus(); q?.select(); }
function pnKey(e,n){ const st=pnState[n]; const dd=$('#pndd-'+n); if(!st||!dd||dd.style.display!=='block') return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); st.sel=(st.sel+(e.key==='ArrowDown'?1:-1)+st.hits.length)%st.hits.length;
    dd.querySelectorAll('.pn-opt').forEach((o,k)=>o.classList.toggle('on',k===st.sel)); }
  else if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); pnPick(n, st.sel<0?0:st.sel); }
  else if(e.key==='Escape'){ e.stopPropagation(); pnHide(n); } }
function itemNo(n,val){ const el=$('#pn-'+n); if(el){ el.value=val; pnInput(n,el); } }
async function manualSearch(){
  const model=$('#r-model')?.value, box=$('#manual-results'), lk=$('#manual-link'); if(!box) return;
  const sb=$('#r-search'); sb.disabled=!model; sb.placeholder=L(model?'输入零件号或名称，如 jaw plate / 1100024929':'请先在上面选择机型');
  const doc=partsManualDoc(model); lk.innerHTML = L(doc? `· <a href="${esc(docHref(doc))}" target="_blank">打开 ${esc(model)} 零配件手册</a>` : (model?`· <span style="color:var(--muted)">${esc(model)} 的零配件手册还没上传到文档库</span>`:''));
  const q=($('#r-search')?.value||'').trim().toLowerCase(); if(!model||q.length<2){ box.innerHTML=''; return; }
  const idx=await loadManualIndex(model); if(!idx){ box.innerHTML=L(`<div class="empty" style="padding:8px">${esc(model)} 还没有手册索引（用 tools/build_manual_index.py 生成）</div>`); return; }
  const terms=q.split(/\s+/); const hits=idx.parts.filter(p=>{ const s=(p.pn+' '+p.en+' '+p.zh).toLowerCase(); return terms.every(t=>s.includes(t)); });
  const figName=f=>(idx.figures.find(x=>x.fig===f)||{}).name||'';
  box.innerHTML = L(hits.length? `<table style="font-size:12px">${hits.slice(0,25).map(p=>`<tr><td class="mono">${esc(p.pn)}</td><td>${esc(p.en)}<br><span style="color:var(--muted)">${esc(p.zh)}</span></td><td style="color:var(--muted)">图 ${esc(p.fig)} ${esc(figName(p.fig))}<br>项 ${esc(p.item)} · 装机数 ${esc(p.qty)}</td><td class="row-actions">${doc?`<a href="${esc(manualLink(model,p.page))}" target="_blank">p.${esc(p.page)}</a> `:''}<button onclick='addFromManual(${JSON.stringify(p).replace(/'/g,"&#39;")})'>添加</button></td></tr>`).join('')}</table>${hits.length>25?`<small style="color:var(--muted)">还有 ${hits.length-25} 条，请输入更具体的词</small>`:''}` : `<small style="color:var(--muted)">没找到，可以直接在上面手填名称和描述</small>`);
}
function addFromManual(p){ const cat=db.parts.find(x=>x.partNo===p.pn); const blank=draftItems.findIndex(i=>!i.partNo&&!i.name); const it={partId:cat?cat.id:'',partNo:p.pn,name:LANG==='zh'?(p.zh||p.en):(p.en||p.zh),qty:1,fig:p.fig,item:p.item,page:p.page};
  if(blank>=0) draftItems[blank]=it; else draftItems.push(it); renderItems(); $('#r-search').value=''; $('#manual-results').innerHTML=''; }
function compressImage(file){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,1400/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); c.toBlob(b=>res(b),'image/jpeg',.82); }; img.onerror=()=>res(file); img.src=URL.createObjectURL(file); }); }
async function saveRequest(id, part){
  const doReq=part!=='proc', doProc=part!=='req'&&!!id;
  const v=k=>$('#r-'+k)?.value.trim()??'';
  const items=draftItems.filter(i=>i.partNo||i.name).map(i=>({...i,qty:Number(i.qty)||1}));
  if(doReq){ if(!v('req')) return toast('请填申请人'); if(!v('model')) return toast('请选择机型'); if(!items.length) return toast('至少添加一项配件'); if(!id) rememberName(v('req')); }
  const btn=$('#r-save-'+part)||$('#r-save')||document.createElement('button'); const btnTxt=btn.textContent; btn.disabled=true;
  let photos=[];
  if(doReq&&draftPhotos.length){ if(!gh.token){ alert('上传照片需要通过团队链接打开本页（或配置 token）。本次先不带照片提交。'); }
    else for(const [k,f] of draftPhotos.entries()){ btn.textContent=L(`上传照片 ${k+1}/${draftPhotos.length}…`); try{ const blob=await compressImage(f); const path=`attachments/${(id? db.requests.find(x=>x.id===id).no : 'NFLG-'+String(db.meta.nextReqNo||1).padStart(4,'0'))}/${Date.now()}-${k}.jpg`; const up=await uploadToRepo(path,blob); photos.push({path:up.path,sha:up.sha,name:f.name}); }catch(e){ alert('照片上传失败：'+e.message); } } }
  snapshot(); let r; const isNew=!id;
  if(id) r=db.requests.find(x=>x.id===id); else { const n=db.meta.nextReqNo||1; db.meta.nextReqNo=n+1; r={id:uid(),no:'NFLG-'+String(n).padStart(4,'0'),date:today(),status:'requested',history:[{ts:new Date().toISOString(),user:me(),kind:'created'}]}; db.requests.push(r); }
  const prev=r.status;
  if(doReq) Object.assign(r,{requester:v('req'),unit:v('unit'),model:v('model'),urgency:v('urg'),items,reason:v('reason'),needBy:v('need'),notes:'',photos:[...(r.photos||[]),...photos]});
  if(doProc) Object.assign(r,{status:v('status')||r.status,date:v('date')||r.date,materialCost:moneyFmt(v('mcost')),freightCost:moneyFmt(v('fcost')),poNo:v('po'),shipping:v('ship'),eta:v('eta')});
  if(prev&&prev!==r.status){ (r.history=r.history||[]).push({ts:new Date().toISOString(),user:me(),from:prev,to:r.status});
    if(r.status==='received'&&!r.receivedApplied){ for(const i of items){ const p=partById(i.partId); if(p) p.stock=stockOf(p)+i.qty; } r.receivedApplied=true; r.receivedDate=today(); } }
  else if(!isNew){ (r.history=r.history||[]).push({ts:new Date().toISOString(),user:me(),kind:'edited'}); }
  if(doReq) for(const i of items){ if(!i.partId&&i.partNo){ const p={id:uid(),partNo:i.partNo,nameZh:/[\u4e00-\u9fff]/.test(i.name)?i.name:'',nameEn:/[\u4e00-\u9fff]/.test(i.name)?'':i.name,models:v('model')?[v('model')]:[],unit:'pc',stock:0,minStock:'',currency:'USD'}; db.parts.push(p); i.partId=p.id; } }
  markDirty();
  if(part){ render(); if(gh.token) await save(false); else toast('已记录在本机，需要通过团队链接打开本页才能提交到服务器');
    editRequest(r.id); const b2=$('#r-save-'+part); if(b2){ b2.textContent=L('已保存 ✓'); setTimeout(()=>{ if(b2.isConnected) b2.textContent=btnTxt; },1600); } return true; }
  closeModal(); render();
  if(gh.token){ await save(false); } else toast('已记录在本机，需要通过团队链接打开本页才能提交到服务器');
  return true;
}

/* --- service --- */
let draftUsed=[];
function editService(id, eqId){
  const s = id? db.service.find(x=>x.id===id) : {date:today(),equipmentId:eqId||'',technician:''};
  if(!id&&eqId){ const e=db.equipment.find(x=>x.id===eqId); if(e) s.site=e.site; }
  draftUsed = JSON.parse(JSON.stringify(s.partsUsed||[]));
  openModal(`<h2>${id?'编辑维修记录':'新维修记录'} Service</h2><div class="grid">
    ${field('s-date','日期',inp('s-date',s.date,'date'))}
    ${field('s-eq','设备 *',`<select id="s-eq" onchange="const e=db.equipment.find(x=>x.id===this.value);if(e&&e.site)document.getElementById('s-site').value=e.site">${eqOpts(s.equipmentId)}</select>`)}
    ${field('s-site','站点',`<select id="s-site">${siteOpts(s.site)}</select>`)}
    ${field('s-tech','技工 / 负责人',inp('s-tech',s.technician))}
    <div class="full">${field('s-issue','故障现象 Issue *',inp('s-issue',s.issue))}</div>
    <div class="full">${field('s-work','处理过程 Work done',`<textarea id="s-work">${esc(s.work||'')}</textarea>`)}</div>
    <div class="full"><label class="f">用料 Parts used（保存时自动扣库存）</label><div class="items" id="used"></div></div>
    ${field('s-hours','工时 Labor hours',inp('s-hours',s.hours,'number','step="0.5"'))}
    ${field('s-down','停机时间 Downtime (h)',inp('s-down',s.downtimeHours,'number','step="0.5"'))}
    ${field('s-meter','设备小时表读数',inp('s-meter',s.meter,'number'))}
    ${field('s-nflg','是否已反馈 NFLG',`<select id="s-nflg">${opts([['','否'],['yes','是 – 已反馈厂家'],['warranty','是 – 保修索赔']],s.nflg)}</select>`)}
    <div class="full">${field('s-notes','备注',`<textarea id="s-notes">${esc(s.notes||'')}</textarea>`)}</div>
  </div><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveService('${id||''}')">保存</button></div>`);
  renderUsed();
}
function renderUsed(){
  const dl=`<datalist id="used-dl">${db.parts.map(p=>`<option value="${esc(p.partNo)}">${esc(pnameTxt(p))} (库存 ${stockOf(p)})</option>`).join('')}</datalist>`;
  $('#used').innerHTML = L(dl+`<table>${draftUsed.map((i,n)=>`<tr><td><input list="used-dl" value="${esc(i.partNo)}" oninput="const p=db.parts.find(x=>x.partNo===this.value);draftUsed[${n}].partNo=this.value;draftUsed[${n}].partId=p?p.id:''"></td><td style="width:90px"><input type="number" min="1" value="${esc(i.qty)}" oninput="draftUsed[${n}].qty=Number(this.value)"></td><td style="width:40px"><button class="btn sm" onclick="draftUsed.splice(${n},1);renderUsed()">✕</button></td></tr>`).join('')}</table>
    <button class="btn sm" style="margin-top:6px" onclick="draftUsed.push({partId:'',partNo:'',qty:1});renderUsed()">＋ 添加用料</button>`);
}
function saveService(id){
  const v=k=>$('#s-'+k).value.trim(); if(!v('eq')||!v('issue')) return alert('设备和故障现象必填');
  snapshot(); let s; if(id) s=db.service.find(x=>x.id===id); else { s={id:uid()}; db.service.push(s); }
  const used=draftUsed.filter(i=>i.partNo).map(i=>({...i,qty:Number(i.qty)||1}));
  // stock adjustment: reverse old usage, apply new
  for(const i of s.partsUsed||[]){ const p=partById(i.partId); if(p) p.stock=stockOf(p)+Number(i.qty||0); }
  for(const i of used){ const p=partById(i.partId); if(p) p.stock=stockOf(p)-i.qty; }
  const num=k=>v(k)===''?'':Number(v(k));
  Object.assign(s,{date:v('date'),equipmentId:v('eq'),site:v('site'),technician:v('tech'),issue:v('issue'),work:v('work'),partsUsed:used,hours:num('hours'),downtimeHours:num('down'),meter:num('meter'),nflg:v('nflg'),notes:v('notes')});
  if(s.meter!==''){ const e=db.equipment.find(x=>x.id===s.equipmentId); if(e) e.hours=s.meter; }
  markDirty(); closeModal(); render();
}

/* ============ wiring ============ */
applyStaticL();
$('#q').oninput=()=>render();

$('#save').onclick=()=>save(false);
$('#reload').onclick=()=>{ if(gh.token) pull(); else load(); };
document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save();} else if(e.key==='Escape') leaveRequest(); });
window.addEventListener('beforeunload',e=>{ if(dirty||saving){ e.preventDefault(); e.returnValue=''; } });
load();
</script>
