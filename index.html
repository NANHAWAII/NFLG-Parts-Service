<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NFLG Parts Service</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --line:#e3e6ea; --text:#1d2330; --muted:#6b7380;
    --accent:#1f5fbf; --accent-soft:#e7effc; --ok:#1e8e4f; --warn:#c77d00; --bad:#c6303e;
    --chip:#eef1f5; --shadow:0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --radius:10px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1319; --panel:#171c24; --line:#2a313c; --text:#e8ebf0; --muted:#9aa3b2;
      --accent:#6ea0ef; --accent-soft:#1d2a40; --chip:#222a35; --shadow:none;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1319; --panel:#171c24; --line:#2a313c; --text:#e8ebf0; --muted:#9aa3b2;
    --accent:#6ea0ef; --accent-soft:#1d2a40; --chip:#222a35; --shadow:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}
  @media (min-width:1800px){ body{font-size:16px} }
  a{color:var(--accent)}
  button,input,select,textarea{font:inherit;color:inherit}
  .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  nav{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
  .brand{font-weight:700;font-size:19px;padding:4px 12px 22px;line-height:1.25;letter-spacing:-.01em}
  .brand small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:3px}
  nav button{background:none;border:0;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:15px}
  nav button:hover{background:var(--chip)}
  nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  nav .count{font-size:11px;background:var(--chip);color:var(--muted);padding:1px 7px;border-radius:999px}
  nav .spacer{flex:1}
  .status{font-size:12.5px;color:var(--muted);padding:12px 12px 4px;border-top:1px solid var(--line);line-height:1.5}
  .status b{color:var(--text)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
  main{padding:28px 36px 80px;max-width:1500px;width:100%;margin:0 auto}
  .topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
  .topbar h1{font-size:26px;margin:0;flex:1;letter-spacing:-.01em}
  .btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:9px;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap;font-weight:500}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn.danger{color:var(--bad)}
  .btn.sm{padding:5px 10px;font-size:13px;font-weight:400}
  .btn:disabled{opacity:.5;cursor:default}
  input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
    border:1px solid var(--line);background:var(--panel);padding:9px 12px;border-radius:9px;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  textarea{min-height:70px;resize:vertical}
  .search{max-width:360px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .card .k{font-size:12px;color:var(--muted)} .card .v{font-size:26px;font-weight:700;margin-top:2px} .card .v.bad{color:var(--bad)} .card .v.warn{color:var(--warn)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
  .panel h2{font-size:15px;margin:0;padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-weight:600;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;background:var(--bg);position:sticky;top:0;cursor:pointer;user-select:none}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:var(--accent-soft)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .mono{font-family:var(--mono);font-size:13px}
  .chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:500;background:var(--chip);white-space:nowrap}
  .chip.s-requested{background:#eceff3;color:#4b5563}
  .chip.s-quoting{background:#fff4d6;color:#8a5a00}
  .chip.s-ordered{background:#e3ecff;color:#1f4fbf}
  .chip.s-shipped{background:#e6f4ff;color:#0b6aa2}
  .chip.s-received{background:#e1f5e8;color:#1e7a46}
  .chip.s-closed{background:#efefef;color:#777}
  .chip.u-urgent{background:#fde4e6;color:#b4232f} .chip.u-high{background:#fff0d9;color:#9a5b00}
  .chip.low{background:#fde4e6;color:#b4232f}
  .empty{padding:64px 28px;text-align:center;color:var(--muted);font-size:15px}
  .empty .ico{font-size:40px;line-height:1;margin-bottom:12px;opacity:.5}
  .row-actions{white-space:nowrap}
  .row-actions button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0 5px;font-size:14px}
  .row-actions button.del{color:var(--bad)}
  /* pipeline */
  .pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px}
  .pipe .col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:8px;min-height:120px}
  .pipe .col h3{font-size:13px;margin:0 0 10px;color:var(--muted);display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.04em}
  .pipe .col.over{outline:2px dashed var(--accent)}
  .rcard{border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:8px;background:var(--bg);cursor:grab;font-size:13px}
  .rcard b{display:block;font-size:14px;margin-bottom:2px}
  .rcard .meta{color:var(--muted)}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border-radius:14px;width:100%;max-width:820px;padding:26px 30px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h2{margin:0 0 18px;font-size:21px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 18px}
  .grid .full{grid-column:1/-1}
  label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .note{background:var(--accent-soft);border-radius:9px;padding:10px 14px;font-size:13.5px;margin-bottom:16px;line-height:1.5}
  .items table td{padding:4px 6px}
  .items input{padding:4px 8px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
  .hist{font-size:12px;color:var(--muted);max-height:120px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .filters select,.filters input{width:auto}
  @media (max-width: 900px){
    .app{grid-template-columns:1fr}
    nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}
    .brand{width:100%}
    nav .spacer,.status{display:none}
    .pipe{grid-template-columns:1fr 1fr}
    .grid{grid-template-columns:1fr}
    main{padding:14px 16px}
    table{font-size:12px}
  }
  @media print{ nav,.topbar .btn,.row-actions,.filters{display:none!important} .app{display:block} main{padding:0} }
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="brand">NFLG Parts Service<small>南方路机配件服务 · Nan, Inc. 内部</small></div>
    <button data-view="requests" class="active">配件申请 Requests <span class="count" id="c-requests"></span></button>
    <button data-view="docs">文档库 Documents <span class="count" id="c-docs"></span></button>
    <button data-view="settings">设置 Settings</button>
    <div class="spacer"></div>
    <button id="lang" style="justify-content:center;border:1px solid var(--line);margin-bottom:6px">EN</button>
    <div class="status" id="status"></div>
  </nav>
  <main>
    <div class="topbar">
      <h1 id="title">概览</h1>
      <input type="text" id="q" class="search" placeholder="搜索 Search… (零件号 / 名称 / 机型 / 申请人)">

      <button class="btn" id="redo" title="重做 Redo (Ctrl+Y)">↷</button>
      <button class="btn" id="reload">⟳ 重新加载</button>
      <button class="btn primary" id="save">保存到 GitHub</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

  return s.split(/(\uE000[^\uE001]*\uE001)/).map((seg,n)=> n%2 ? seg.slice(1,-1) : seg.replace(i18nRe,m=>I18N_MAP[m][i])).join(''); }

(function(){ const m=location.hash.match(/#t=([A-Za-z0-9+/=_-]+)/); if(!m) return;

  history.replaceState(null,'',location.pathname+location.search); })();
// Default owner/repo from the Pages URL (https://<owner>.github.io/<repo>/) so nobody has to type them
(function(){ const m=location.hostname.match(/^([^.]+)\.github\.io$/), p=location.pathname.split('/').filter(Boolean)[0]; if(m&&p){ gh.owner=gh.owner||m[1]; gh.repo=gh.repo||p; gh.branch=gh.branch||'main'; } })();

function setStatus(html){ $('#status').innerHTML = L(html); }
function toast(msg){ const t=$('#toast'); t.textContent=L(msg); t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function markDirty(){ dirty=true; localStorage.setItem('nflg.draft', JSON.stringify(db)); updateStatus(); }
function updateStatus(){
  const conn = gh.token ? `<span class="dot ok"></span>GitHub: <b>${esc(gh.owner)}/${esc(gh.repo)}</b>` : `<span class="dot warn"></span>未配置 GitHub token（只读）`;
  const d = dirty ? `<br><span class="dot bad"></span><b>有未保存的修改</b>` : `<br><span class="dot ok"></span>已同步`;
  const upd = db.meta.updated ? `<br>最后保存 ${esc(db.meta.updated.replace('T',' ').slice(0,16))} ${esc(db.meta.updatedBy||'')}` : '';
  setStatus(conn+d+upd+(me()?`<br>当前用户 ${esc(me())} · ${isProc()?'采购部':'申请人'}`:''));
  $('#save').disabled = !dirty || !gh.token;
  $('#undo').disabled = !undoStack.length; $('#redo').disabled = !redoStack.length;
  $('#c-requests').textContent = db.requests.filter(r=>r.status!=='closed').length; $('#c-docs').textContent = (db.docs||[]).length;
}
function snapshot(){ undoStack.push(JSON.stringify(db)); if(undoStack.length>40) undoStack.shift(); redoStack.length=0; }
function undo(){ if(!undoStack.length) return; redoStack.push(JSON.stringify(db)); db=JSON.parse(undoStack.pop()); markDirty(); render(); }
function redo(){ if(!redoStack.length) return; undoStack.push(JSON.stringify(db)); db=JSON.parse(redoStack.pop()); markDirty(); render(); }

const apiUrl = () => `https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${DATA_PATH}`;
const ghHeaders = () => ({Authorization:'Bearer '+gh.token, Accept:'application/vnd.github+json'});
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g,''))));

async function load(){
  // Draft left over from a crashed/unsaved session
  const draft = localStorage.getItem('nflg.draft');
  try {
    let remote=null;
    if (gh.token && gh.owner && gh.repo){
      const r = await fetch(apiUrl()+'?ref='+encodeURIComponent(gh.branch||'main'), {headers:ghHeaders(), cache:'no-store'});
      if (r.status===404){ remote=emptyDb(); remoteSha=null; toast('仓库里还没有 '+DATA_PATH+'，保存时会自动创建'); }
      else if (!r.ok) throw new Error('GitHub '+r.status);
      else { const j=await r.json(); remoteSha=j.sha; remote=JSON.parse(b64dec(j.content)); }
    } else {
      const r = await fetch(DATA_PATH+'?t='+Date.now(), {cache:'no-store'});
      if (r.ok) remote = await r.json(); else remote = emptyDb();
    }
    db = Object.assign(emptyDb(), remote); db.meta = Object.assign(emptyDb().meta, remote.meta||{});
  } catch(e){ console.warn(e); toast('加载失败：'+e.message+'（使用本地数据）'); if(!draft) db=emptyDb(); }
  if (draft && confirm('发现上次未保存的本地修改，要恢复吗？\n（取消 = 丢弃本地修改，使用仓库版本）')) { db=JSON.parse(draft); dirty=true; }
  else { localStorage.removeItem('nflg.draft'); dirty=false; }
  updateStatus(); render();
}

async function save(force){
  if (!gh.token){ toast('请先在「设置」里填写 GitHub token'); return; }
  $('#save').disabled=true; $('#save').textContent=L('保存中…');
  try {
    // conflict check: has someone else saved since we loaded?
    const r = await fetch(apiUrl()+'?ref='+encodeURIComponent(gh.branch||'main'), {headers:ghHeaders(), cache:'no-store'});
    let currentSha=null;
    if (r.ok){ const j=await r.json(); currentSha=j.sha;
      if (!force && remoteSha && currentSha!==remoteSha){
        const remote=JSON.parse(b64dec(j.content));
        if (!confirm(`注意：${remote.meta?.updatedBy?esc(remote.meta.updatedBy):'其他人'} 在 ${remote.meta?.updated?esc(remote.meta.updated):'你加载之后'} 保存过新版本。\n\n确定 = 用你的版本覆盖（对方的修改会丢失）\n取消 = 先放弃保存，点「重新加载」后再改`)) {
          $('#save').textContent=L('保存到 GitHub'); updateStatus(); return; }
      }
    }
    db.meta.updated = new Date().toISOString(); db.meta.updatedBy = me();
    const body = {message:`update db.json (${me()||'web'}) ${db.meta.updated.slice(0,16)}`, content:b64enc(JSON.stringify(db,null,2)), branch:gh.branch||'main'};
    if (currentSha) body.sha=currentSha;
    const p = await fetch(apiUrl(), {method:'PUT', headers:{...ghHeaders(),'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if (!p.ok){ const t=await p.text(); throw new Error(p.status+' '+t.slice(0,200)); }
    const j = await p.json(); remoteSha=j.content.sha; dirty=false; localStorage.removeItem('nflg.draft');
    toast('已保存到 GitHub ✓');
  } catch(e){ alert('保存失败：'+e.message); }
  $('#save').textContent=L('保存到 GitHub'); updateStatus();
}

function stockOf(p){ return Number(p.stock||0); }
function isLow(p){ return p.minStock!=null && p.minStock!=='' && stockOf(p) <= Number(p.minStock); }
function onOrderQty(partId){ return db.requests.filter(r=>['ordered','shipped'].includes(r.status)).flatMap(r=>r.items||[]).filter(i=>i.partId===partId).reduce((s,i)=>s+Number(i.qty||0),0); }
function csv(rows, name){
  const s = rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'})); a.download=name; a.click();
}
function opts(list, cur, blank){ return (blank?`<option value="">${blank}</option>`:'')+list.map(([k,v])=>`<option value="${k}" ${k===cur?'selected':''}>${v}</option>`).join(''); }

function pipelineHtml(list){

        <b>${esc(r.no)} ${r.urgency!=='normal'?`<span class="chip u-${r.urgency}">${lbl(URGENCY,r.urgency)}</span>`:''}</b>
        ${(r.items||[]).slice(0,3).map(i=>`<div>${esc(i.partNo||'')} ${esc(i.name||'')} ×${esc(i.qty)}</div>`).join('')}${(r.items||[]).length>3?`<div class="meta">…共 ${r.items.length} 项</div>`:''}
        <div class="meta">${esc(r.site||'')} · ${esc(r.model||'')}${r.unit?' '+esc(r.unit):''}<br>${esc(r.requester||'')} · ${esc(r.date||'')}${r.eta?` · ETA ${esc(r.eta)}`:''}</div>
      </div>`).join('')}</div>`; }).join('')}</div>`;
}
function bindPipeline(){
  if(!isProc()) return;
  let dragId=null;
  document.querySelectorAll('.rcard[draggable]').forEach(c=>{ c.ondragstart=e=>{dragId=c.dataset.id; e.dataTransfer.effectAllowed='move';}; });
  document.querySelectorAll('.pipe .col').forEach(col=>{
    col.ondragover=e=>{e.preventDefault(); col.classList.add('over');};
    col.ondragleave=()=>col.classList.remove('over');
    col.ondrop=e=>{ e.preventDefault(); col.classList.remove('over'); if(!dragId) return; setStatus_(dragId, col.dataset.status); dragId=null; };
  });
}
function setStatus_(id, status){
  const r=db.requests.find(x=>x.id===id); if(!r||r.status===status) return;
  snapshot(); const prev=r.status; r.status=status;
  (r.history=r.history||[]).push({ts:new Date().toISOString(), user:me(), action:`${lbl(STATUSES,prev)} → ${lbl(STATUSES,status)}`});
  if (status==='received' && !r.receivedApplied){ // put stock in
    for (const i of r.items||[]){ const p=partById(i.partId); if(p) p.stock=stockOf(p)+Number(i.qty||0); }
    r.receivedApplied=true; r.receivedDate=today();
  }
  markDirty(); render();
}

function importPartsCsv(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.csv,text/csv';
  inp.onchange=async()=>{ const txt=await inp.files[0].text(); const rows=parseCsv(txt); if(rows.length<2) return toast('CSV 为空');
    const h=rows[0].map(x=>x.trim().toLowerCase()); const col=n=>h.indexOf(n.toLowerCase());
    const ix={partNo:col('PartNo'),oemNo:col('OEMNo'),nameZh:col('NameZh'),nameEn:col('NameEn'),models:col('Models'),unit:col('Unit'),stock:col('Stock'),minStock:col('MinStock'),lastPrice:col('LastPrice'),currency:col('Currency'),lastPriceDate:col('LastPriceDate'),leadTimeDays:col('LeadTimeDays'),location:col('Location'),notes:col('Notes')};
    if(ix.partNo<0) return alert('CSV 需要至少有 PartNo 列（列名同导出格式）');
    snapshot(); let added=0,updated=0;
    for(const r of rows.slice(1)){ const no=(r[ix.partNo]||'').trim(); if(!no) continue; let p=db.parts.find(x=>x.partNo===no); if(!p){p={id:uid(),partNo:no}; db.parts.push(p); added++;} else updated++;
      for(const k in ix){ if(ix[k]<0||k==='partNo') continue; let v=r[ix[k]]; if(v==null||v==='') continue; if(k==='models') v=v.split(/[;,]/).map(s=>s.trim()).filter(Boolean); else if(['stock','minStock','lastPrice','leadTimeDays'].includes(k)) v=Number(v); p[k]=v; } }
    markDirty(); render(); toast(`导入完成：新增 ${added}，更新 ${updated}`); };
  inp.click();
}
function parseCsv(t){ const rows=[]; let row=[],cur='',q=false; t=t.replace(/^\ufeff/,'');
  for(let i=0;i<t.length;i++){ const c=t[i]; if(q){ if(c==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(cur);cur='';} else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=c; }
  if(cur!==''||row.length){row.push(cur);rows.push(row);} return rows.filter(r=>r.some(x=>x!=='')); }

function saveModel(code){
  const v=k=>$('#m-'+k).value.trim(); const nc=v('code'); if(!nc) return alert('型号必填');

async function saveDoc(id){
  const v=k=>$('#d-'+k).value.trim(); if(!v('model')||!v('title')) return alert('机型和标题必填');
  const src=document.querySelector('input[name=d-src]:checked').value;
  if(src==='url'&&v('url')&&!/^https?:\/\//i.test(v('url'))) return alert('链接需以 http(s):// 开头');
  const existing = id? db.docs.find(x=>x.id===id) : null;
  let uploaded=null;
  if(src==='upload'&&docFile){
    if(!gh.token) return alert('上传文件需要先在「设置」里配置 GitHub token；或者改用外部链接。');
    if(docFile.size>MAX_UPLOAD_MB*1048576) return alert(`文件 ${fmtSize(docFile.size)} 超过 ${MAX_UPLOAD_MB} MB，请放 OneDrive 后填链接。`);
    const btn=$('#d-save'); btn.disabled=true; btn.textContent=L('上传中… ')+fmtSize(docFile.size);
    try { uploaded = await uploadToRepo(`docs/${v('model')}/${docFile.name.replace(/[\\/:*?"<>|]/g,'_')}`, docFile); }
    catch(e){ btn.disabled=false; btn.textContent='保存'; return alert('上传失败：'+e.message); }
    if(existing?.path && existing.path!==uploaded.path) deleteFromRepo(existing.path, existing.sha).catch(()=>{});
  } else if(src==='upload'&&!existing?.path&&!id){ return alert('请选择要上传的文件，或改选其他来源'); }
  snapshot(); let d; if(id) d=existing; else { d={id:uid()}; (db.docs=db.docs||[]).push(d); }
  Object.assign(d,{model:v('model'),category:v('cat'),title:v('title'),version:v('version'),date:v('date'),notes:v('notes')});
  if(uploaded){ Object.assign(d,{path:uploaded.path,sha:uploaded.sha,size:docFile.size,fileName:docFile.name,url:'',uploadedBy:me(),uploadedAt:new Date().toISOString()}); }
  else if(src==='url'){ if(d.path) deleteFromRepo(d.path,d.sha).catch(()=>{}); Object.assign(d,{url:v('url'),path:'',sha:'',size:'',fileName:''}); }
  else if(src==='none'){ if(d.path) deleteFromRepo(d.path,d.sha).catch(()=>{}); Object.assign(d,{url:'',path:'',sha:'',size:'',fileName:''}); }
  sessionStorage.setItem('f.model',d.model); markDirty(); closeModal(); render();
  if(uploaded) { toast('文件已上传，正在保存记录…'); await save(false); }
}

function fileToB64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.onerror=rej; r.readAsDataURL(file); }); }
async function uploadToRepo(path, file){
  const url=`https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
  const body={message:`upload ${path} (${me()||'web'})`, content:await fileToB64(file), branch:gh.branch||'main'};
  const g=await fetch(url+'?ref='+encodeURIComponent(gh.branch||'main'),{headers:ghHeaders(),cache:'no-store'}); if(g.ok){ body.sha=(await g.json()).sha; }
  const r=await fetch(url,{method:'PUT',headers:{...ghHeaders(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,200));
  const j=await r.json(); return {path, sha:j.content.sha};
}
async function deleteFromRepo(path, sha){
  const url=`https://api.github.com/repos/${gh.owner}/${gh.repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}`;
  if(!sha){ const g=await fetch(url+'?ref='+encodeURIComponent(gh.branch||'main'),{headers:ghHeaders(),cache:'no-store'}); if(!g.ok) return; sha=(await g.json()).sha; }
  const r=await fetch(url,{method:'DELETE',headers:{...ghHeaders(),'Content-Type':'application/json'},body:JSON.stringify({message:`delete ${path} (${me()||'web'})`,sha,branch:gh.branch||'main'})});
  if(!r.ok) throw new Error(r.status+' '+(await r.text()).slice(0,200));
}

    ${proc?'':`<div class="note">填好后点「提交」即可，采购部会向南方路机询价、下单并跟踪物流，进度在本页查看。零件号不清楚的话，在下方「查手册」里按名称搜，点「添加」自动带入。</div>`}
    <div class="grid">
      ${field('r-req','申请人 Requester *',inp('r-req',r.requester,'text','placeholder="你的名字（下次自动填）"'))}
      ${field('r-site','站点 Site',`<select id="r-site">${siteOpts(r.site)}</select>`)}
      ${field('r-model','机型 Model *',`<select id="r-model" onchange="manualSearch()">${modelOpts(r.model||'')}</select>`)}
      ${field('r-unit','设备编号 / 序列号 Unit no. / serial',inp('r-unit',r.unit,'text','placeholder="Crusher #1 / SN …"'))}
      ${field('r-urg','紧急度 Urgency',`<select id="r-urg">${opts(URGENCY,r.urgency)}</select>`)}
      ${field('r-need','需要日期 Need by',inp('r-need',r.needBy,'date'))}
      <div class="full"><label class="f">配件 Items *</label><div class="items" id="items"></div></div>
      <div class="full"><label class="f">查手册 Find in parts manual <span id="manual-link"></span></label>
        <input type="text" id="r-search" placeholder="输入零件号、英文或中文名，如 jaw plate / 颚板 / 1100024929" oninput="manualSearch()"><div id="manual-results" style="margin-top:6px"></div></div>
      <div class="full">${field('r-reason','用途 / 故障原因 Reason',inp('r-reason',r.reason,'text','placeholder="例如：动颚板磨损严重，出料粒径偏大"'))}</div>
      <div class="full"><label class="f">照片 Photos（损坏部位、铭牌等）</label><input type="file" id="r-photos" accept="image/*" multiple onchange="draftPhotos=[...this.files]">
        <div id="photo-list" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${(r.photos||[]).map((p,i)=>`<a href="${esc(docHref(p))}" target="_blank"><img src="${esc(docHref(p))}" style="height:64px;border-radius:6px;border:1px solid var(--line)"></a>`).join('')}</div></div>
      ${proc?`<div class="full"><hr style="border:0;border-top:1px solid var(--line)"><small style="color:var(--muted)">采购部 Procurement</small></div>
      ${field('r-status','状态 Status',statusHtml)}
      ${field('r-date','申请日期',inp('r-date',r.date,'date'))}
      ${field('r-quote','报价 Quote（总价）',inp('r-quote',r.quoteTotal,'text','placeholder="USD 1,250 / CNY 8,600"'))}
      ${field('r-po','PO#',inp('r-po',r.poNo))}
      ${field('r-ship','运输方式 / 单号 Tracking',inp('r-ship',r.shipping,'text','placeholder="DHL 1234567890 / 海运 Matson"'))}
      ${field('r-eta','预计到货 ETA',inp('r-eta',r.eta,'date'))}`
      : `${field('r-status','状态 Status',statusHtml)}`}
      <div class="full">${field('r-notes','备注',`<textarea id="r-notes">${esc(r.notes||'')}</textarea>`)}</div>
      ${!id&&!proc&&db.meta.procurementEmail?`<div class="full"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="r-mail" checked> 提交后打开邮件通知采购部（${esc(db.meta.procurementEmail)}）</label></div>`:''}
      ${r.history?.length?`<div class="full"><label class="f">进度记录</label><div class="hist">${r.history.slice().reverse().map(h=>`<div>${esc(h.ts.replace('T',' ').slice(0,16))} ${esc(h.user)} — ${esc(h.action)}</div>`).join('')}</div></div>`:''}
    </div><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="r-save" onclick="saveRequest('${id||''}')">${id?'保存':(proc?'保存':'提交申请')}</button></div>`);
  renderItems(); manualSearch();
}
function renderItems(){
  const dl = `<datalist id="parts-dl">${db.parts.map(p=>`<option value="${esc(p.partNo)}">${esc(pnameTxt(p))} (库存 ${stockOf(p)})</option>`).join('')}</datalist>`;
  $('#items').innerHTML = L(dl+`<table><tr><th style="width:30%">零件号 Part No.</th><th>名称 / 描述</th><th style="width:70px">数量</th><th style="width:40px"></th></tr>
    ${draftItems.map((i,n)=>`<tr><td><input list="parts-dl" value="${esc(i.partNo)}" oninput="itemNo(${n},this.value)" placeholder="可不填，按名称搜"></td><td><input value="${esc(i.name)}" oninput="draftItems[${n}].name=this.value" placeholder="名称或描述（手填也可以）">${i.fig?`<small style="color:var(--muted)">手册图 ${esc(i.fig)}${i.item?' 项 '+esc(i.item):''}${i.page?(manualLink($('#r-model')?.value,i.page)?` · <a href="${esc(manualLink($('#r-model')?.value,i.page))}" target="_blank" title="Open manual page">p.${esc(i.page)}</a>`:` · p.${esc(i.page)}`):''}</small>`:''}</td><td><input type="number" min="1" value="${esc(i.qty)}" oninput="draftItems[${n}].qty=Number(this.value)"></td><td><button class="btn sm" onclick="draftItems.splice(${n},1);renderItems()">✕</button></td></tr>`).join('')}
    </table><button class="btn sm" style="margin-top:6px" onclick="draftItems.push({partId:'',partNo:'',name:'',qty:1});renderItems()">＋ 添加一行</button>`);
}
function itemNo(n,val){ const i=draftItems[n]; i.partNo=val; const p=db.parts.find(x=>x.partNo===val); if(p){ i.partId=p.id; i.name=pnameTxt(p); renderItems(); const rows=$('#items').querySelectorAll('tr'); rows[n+1]?.querySelectorAll('input')[1]?.focus(); } else i.partId=''; }
async function manualSearch(){
  const model=$('#r-model')?.value, box=$('#manual-results'), lk=$('#manual-link'); if(!box) return;
  const sb=$('#r-search'); sb.disabled=!model; sb.placeholder=L(model?'输入零件号、英文或中文名，如 jaw plate / 颚板 / 1100024929':'请先在上面选择机型');
  const doc=partsManualDoc(model); lk.innerHTML = L(doc? `· <a href="${esc(docHref(doc))}" target="_blank">打开 ${esc(model)} 零配件手册</a>` : (model?`· <span style="color:var(--muted)">${esc(model)} 的零配件手册还没上传到文档库</span>`:''));
  const q=($('#r-search')?.value||'').trim().toLowerCase(); if(!model||q.length<2){ box.innerHTML=''; return; }
  const idx=await loadManualIndex(model); if(!idx){ box.innerHTML=L(`<div class="empty" style="padding:8px">${esc(model)} 还没有手册索引（用 tools/build_manual_index.py 生成）</div>`); return; }
  const terms=q.split(/\s+/); const hits=idx.parts.filter(p=>{ const s=(p.pn+' '+p.en+' '+p.zh).toLowerCase(); return terms.every(t=>s.includes(t)); });
  const figName=f=>(idx.figures.find(x=>x.fig===f)||{}).name||'';
  box.innerHTML = L(hits.length? `<table style="font-size:12px">${hits.slice(0,25).map(p=>`<tr><td class="mono">${esc(p.pn)}</td><td>${esc(p.en)}<br><span style="color:var(--muted)">${esc(p.zh)}</span></td><td style="color:var(--muted)">图 ${esc(p.fig)} ${esc(figName(p.fig))}<br>项 ${esc(p.item)} · 装机数 ${esc(p.qty)}</td><td class="row-actions">${doc?`<a href="${esc(manualLink(model,p.page))}" target="_blank">p.${esc(p.page)}</a> `:''}<button onclick='addFromManual(${JSON.stringify(p).replace(/'/g,"&#39;")})'>添加</button></td></tr>`).join('')}</table>${hits.length>25?`<small style="color:var(--muted)">还有 ${hits.length-25} 条，请输入更具体的词</small>`:''}` : `<small style="color:var(--muted)">没找到，可以直接在上面手填名称和描述</small>`);
}
function addFromManual(p){ const cat=db.parts.find(x=>x.partNo===p.pn); const blank=draftItems.findIndex(i=>!i.partNo&&!i.name); const it={partId:cat?cat.id:'',partNo:p.pn,name:LANG==='zh'?(p.zh||p.en):(p.en||p.zh),qty:1,fig:p.fig,item:p.item,page:p.page};
  if(blank>=0) draftItems[blank]=it; else draftItems.push(it); renderItems(); $('#r-search').value=''; $('#manual-results').innerHTML=''; }
function compressImage(file){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,1400/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); c.toBlob(b=>res(b),'image/jpeg',.82); }; img.onerror=()=>res(file); img.src=URL.createObjectURL(file); }); }
async function saveRequest(id){
  const v=k=>$('#r-'+k)?.value.trim()??''; if(!v('req')) return toast('请填申请人'); rememberName(v('req'));
  const items=draftItems.filter(i=>i.partNo||i.name).map(i=>({...i,qty:Number(i.qty)||1})); if(!items.length) return toast('至少添加一项配件');
  const btn=$('#r-save'); btn.disabled=true;
  let photos=[];
  if(draftPhotos.length){ if(!gh.token){ alert('上传照片需要通过团队链接打开本页（或配置 token）。本次先不带照片提交。'); }
    else for(const [k,f] of draftPhotos.entries()){ btn.textContent=L(`上传照片 ${k+1}/${draftPhotos.length}…`); try{ const blob=await compressImage(f); const path=`attachments/${(id? db.requests.find(x=>x.id===id).no : 'PR-'+String(db.meta.nextReqNo||1).padStart(4,'0'))}/${Date.now()}-${k}.jpg`; const up=await uploadToRepo(path,blob); photos.push({path:up.path,sha:up.sha,name:f.name}); }catch(e){ alert('照片上传失败：'+e.message); } } }
  snapshot(); let r; const isNew=!id;
  if(id) r=db.requests.find(x=>x.id===id); else { const n=db.meta.nextReqNo||1; db.meta.nextReqNo=n+1; r={id:uid(),no:'PR-'+String(n).padStart(4,'0'),date:today(),status:'requested',history:[{ts:new Date().toISOString(),user:me(),action:'创建'}]}; db.requests.push(r); }
  const prev=r.status;
  if(!v('model')) return toast('请选择机型'); Object.assign(r,{requester:v('req'),site:v('site'),unit:v('unit'),model:v('model'),urgency:v('urg'),items,reason:v('reason'),needBy:v('need'),notes:v('notes'),photos:[...(r.photos||[]),...photos]});
  if(isProc()) Object.assign(r,{status:v('status')||r.status,date:v('date')||r.date,quoteTotal:v('quote'),poNo:v('po'),shipping:v('ship'),eta:v('eta')});
  if(prev&&prev!==r.status){ (r.history=r.history||[]).push({ts:new Date().toISOString(),user:me(),action:`${lbl(STATUSES,prev)} → ${lbl(STATUSES,r.status)}`});
    if(r.status==='received'&&!r.receivedApplied){ for(const i of items){ const p=partById(i.partId); if(p) p.stock=stockOf(p)+i.qty; } r.receivedApplied=true; r.receivedDate=today(); } }
  else if(!isNew){ (r.history=r.history||[]).push({ts:new Date().toISOString(),user:me(),action:'修改'}); }
  for(const i of items){ if(!i.partId&&i.partNo){ const p={id:uid(),partNo:i.partNo,nameZh:/[\u4e00-\u9fff]/.test(i.name)?i.name:'',nameEn:/[\u4e00-\u9fff]/.test(i.name)?'':i.name,models:v('model')?[v('model')]:[],unit:'pc',stock:0,minStock:'',currency:'USD'}; db.parts.push(p); i.partId=p.id; } }
  const wantMail=!!$('#r-mail')?.checked;
  markDirty(); closeModal(); render();
  if(!isProc()||photos.length){ if(gh.token){ await save(false); } else toast('已记录在本机，需要通过团队链接打开本页才能提交到服务器'); }
  if(isNew&&!isProc()&&db.meta.procurementEmail&&wantMail) {
    const body=L(`${r.no} ${r.site||''} ${r.model||''} ${r.unit||''}\n申请人：${r.requester}  紧急度：${lbl(URGENCY,r.urgency)}  需要日期：${r.needBy||'-'}\n${items.map(i=>`- ${i.partNo||''} ${i.name||''} ×${i.qty}`).join('\n')}\n原因：${r.reason||''}\n\n${location.href.split('#')[0]}`);
    location.href=`mailto:${db.meta.procurementEmail}?subject=${encodeURIComponent(L('配件申请 '+r.no+' '+(r.urgency==='urgent'?'【紧急】':'')))}&body=${encodeURIComponent(body)}`; }
}

/* --- service --- */
let draftUsed=[];
function editService(id, eqId){
  const s = id? db.service.find(x=>x.id===id) : {date:today(),equipmentId:eqId||'',technician:''};
  if(!id&&eqId){ const e=db.equipment.find(x=>x.id===eqId); if(e) s.site=e.site; }
  draftUsed = JSON.parse(JSON.stringify(s.partsUsed||[]));
  openModal(`<h2>${id?'编辑维修记录':'新维修记录'} Service</h2><div class="grid">
    ${field('s-date','日期',inp('s-date',s.date,'date'))}
    ${field('s-eq','设备 *',`<select id="s-eq" onchange="const e=db.equipment.find(x=>x.id===this.value);if(e&&e.site)document.getElementById('s-site').value=e.site">${eqOpts(s.equipmentId)}</select>`)}
    ${field('s-site','站点',`<select id="s-site">${siteOpts(s.site)}</select>`)}
    ${field('s-tech','技工 / 负责人',inp('s-tech',s.technician))}
    <div class="full">${field('s-issue','故障现象 Issue *',inp('s-issue',s.issue))}</div>
    <div class="full">${field('s-work','处理过程 Work done',`<textarea id="s-work">${esc(s.work||'')}</textarea>`)}</div>
    <div class="full"><label class="f">用料 Parts used（保存时自动扣库存）</label><div class="items" id="used"></div></div>
    ${field('s-hours','工时 Labor hours',inp('s-hours',s.hours,'number','step="0.5"'))}
    ${field('s-down','停机时间 Downtime (h)',inp('s-down',s.downtimeHours,'number','step="0.5"'))}
    ${field('s-meter','设备小时表读数',inp('s-meter',s.meter,'number'))}
    ${field('s-nflg','是否已反馈 NFLG',`<select id="s-nflg">${opts([['','否'],['yes','是 – 已反馈厂家'],['warranty','是 – 保修索赔']],s.nflg)}</select>`)}
    <div class="full">${field('s-notes','备注',`<textarea id="s-notes">${esc(s.notes||'')}</textarea>`)}</div>
  </div><div class="actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="saveService('${id||''}')">保存</button></div>`);
  renderUsed();
}
function renderUsed(){
  const dl=`<datalist id="used-dl">${db.parts.map(p=>`<option value="${esc(p.partNo)}">${esc(pnameTxt(p))} (库存 ${stockOf(p)})</option>`).join('')}</datalist>`;
  $('#used').innerHTML = L(dl+`<table>${draftUsed.map((i,n)=>`<tr><td><input list="used-dl" value="${esc(i.partNo)}" oninput="const p=db.parts.find(x=>x.partNo===this.value);draftUsed[${n}].partNo=this.value;draftUsed[${n}].partId=p?p.id:''"></td><td style="width:90px"><input type="number" min="1" value="${esc(i.qty)}" oninput="draftUsed[${n}].qty=Number(this.value)"></td><td style="width:40px"><button class="btn sm" onclick="draftUsed.splice(${n},1);renderUsed()">✕</button></td></tr>`).join('')}</table>
    <button class="btn sm" style="margin-top:6px" onclick="draftUsed.push({partId:'',partNo:'',qty:1});renderUsed()">＋ 添加用料</button>`);
}
function saveService(id){
  const v=k=>$('#s-'+k).value.trim(); if(!v('eq')||!v('issue')) return alert('设备和故障现象必填');
  snapshot(); let s; if(id) s=db.service.find(x=>x.id===id); else { s={id:uid()}; db.service.push(s); }
  const used=draftUsed.filter(i=>i.partNo).map(i=>({...i,qty:Number(i.qty)||1}));
  // stock adjustment: reverse old usage, apply new
  for(const i of s.partsUsed||[]){ const p=partById(i.partId); if(p) p.stock=stockOf(p)+Number(i.qty||0); }
  for(const i of used){ const p=partById(i.partId); if(p) p.stock=stockOf(p)-i.qty; }
  const num=k=>v(k)===''?'':Number(v(k));
  Object.assign(s,{date:v('date'),equipmentId:v('eq'),site:v('site'),technician:v('tech'),issue:v('issue'),work:v('work'),partsUsed:used,hours:num('hours'),downtimeHours:num('down'),meter:num('meter'),nflg:v('nflg'),notes:v('notes')});
  if(s.meter!==''){ const e=db.equipment.find(x=>x.id===s.equipmentId); if(e) e.hours=s.meter; }
  markDirty(); closeModal(); render();
}

/* ============ wiring ============ */
applyStaticL();
$('#q').oninput=()=>render();
$('#undo').onclick=undo; $('#redo').onclick=redo;
$('#save').onclick=()=>save(false);
$('#reload').onclick=()=>{ if(dirty&&!confirm('有未保存的修改，重新加载会丢弃它们。继续？')) return; localStorage.removeItem('nflg.draft'); load(); };
document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();undo();} else if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();redo();} else if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save(false);} else if(e.key==='Escape') closeModal(); });
window.addEventListener('beforeunload',e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
load();
</script>
</body>
</html>
